  <script>
    window.APP_VERSION = "10";
    window.APP_BASE = (function () {
      var path = location.pathname;
      if (/\/index\.html$/.test(path)) path = path.replace(/index\.html$/, "");
      if (path.charAt(path.length - 1) !== "/") path += "/";
      return path;
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      (function () {
        var version = window.APP_VERSION || "10";
        // Same script URL as previous versions so the existing registration is updated, not duplicated.
        var swUrl = window.APP_BASE + "sw.js";
        function markReloaded() {
          try { sessionStorage.setItem("printer-sw-reloaded", version); } catch (e) {}
        }
        function alreadyReloaded() {
          try { return sessionStorage.getItem("printer-sw-reloaded") === version; } catch (e) { return false; }
        }
        var reloading = false;
        function reloadOnce() {
          if (reloading || alreadyReloaded()) return;
          reloading = true;
          markReloaded();
          location.reload();
        }
        navigator.serviceWorker.register(swUrl, { scope: window.APP_BASE }).then(function (reg) {
          try { reg.update(); } catch (e) {}
        }).catch(function () {});
        navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);
        navigator.serviceWorker.addEventListener("message", function (event) {
          var data = event.data || {};
          if (data.type === "SW_UPDATED") reloadOnce();
        });
      })();
    }
  </script>
</body>
